[package]
name = "paka"
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["Saul van der Walt", "ChatGPT"]

[dependencies]
argon2 = { version = "0.5", features = ["std"] }
base64 = "0.22"
bincode = "1.3"
cocoon = "0.4"
flate2 = "1"
mime_guess = "2"
mimalloc = { version = "0.1", default-features = false, features = ["secure"] }
rand = "0.8"
salvo = { version = "1", default-features = false, features = ["server", "http1", "http2", "rustls", "ring", "tls12", "test"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sthash = "0.2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[profile.dev.package.cocoon]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
